# Copy to config.toml and edit. Secrets can also come from environment variables:
#   ANTHROPIC_API_KEY, IG_USER_ID, IG_ACCESS_TOKEN, TELEGRAM_BOT_TOKEN,
#   S3_BUCKET, S3_ENDPOINT_URL, S3_ACCESS_KEY, S3_SECRET_KEY

[restaurant]
name = "המסעדה שלי"          # shown big on the title card
handle = "@myrestaurant"      # watermark on every photo + outro
tagline = "טרי מהמטבח, כל יום"
cta = "בואו לטעום 🍴 הזמנת מקום בלינק בביו"
city = "תל אביב"              # used for hashtags
logo = ""                     # optional PNG with transparency, e.g. "assets/logo.png"

[paths]
inbox = "inbox"               # drop photos here (or inbox/YYYY-MM-DD/)
archive = "archive"           # used photos are moved here
output = "output"             # rendered reels
music = "assets/music"        # royalty-free MP3/WAV tracks, one is picked per day
state = "state"
font = ""                     # TTF with Hebrew glyphs, e.g. "assets/fonts/Heebo-Regular.ttf"
font_bold = ""                # e.g. "assets/fonts/Heebo-Bold.ttf"

[video]
width = 1080
height = 1920
fps = 30
seconds_per_photo = 3.5
transition_seconds = 0.6
intro_seconds = 2.5
outro_seconds = 3.0
layout = "auto"               # auto | cover (full-bleed) | card (photo on blurred backdrop)
max_photos = 10
min_photos = 1
crf = 20                      # lower = higher quality / bigger file
preset = "medium"

[music]
enabled = true
volume = 0.8
start_seconds = 0.0           # לדלג על פתיחה שקטה ברצועה
fallback_generated = true     # synthesize a soft pad when assets/music is empty

[ai]
enabled = true                # needs ANTHROPIC_API_KEY; falls back to a template otherwise
model = "claude-opus-5"
language = "he"
style = "חם, מזמין, קצר, כמו שמסעדה שכונתית אהובה הייתה כותבת"
extra_hashtags = ["#תלאביב", "#foodtlv"]
max_hashtags = 12

[instagram]
api_base = "https://graph.facebook.com/v21.0"
user_id = ""                  # Instagram Business account id (or IG_USER_ID env)
access_token = ""             # long-lived token (or IG_ACCESS_TOKEN env)
share_to_feed = true
poll_seconds = 10
poll_timeout_seconds = 900

[storage]
# Instagram downloads the reel from a public URL, so the MP4 must be hosted somewhere.
kind = "none"                 # s3 | static | none
# --- kind = "s3" (AWS S3, Cloudflare R2, Backblaze B2, MinIO) ---
bucket = ""
endpoint_url = ""             # e.g. "https://<account>.r2.cloudflarestorage.com" (leave empty for AWS)
region = "auto"
prefix = "reels/"
presign_seconds = 3600        # private bucket + presigned URL (default)
public_base_url = ""          # or a public bucket / CDN base URL
# --- kind = "static" (a folder your web server already serves) ---
static_dir = ""               # e.g. "/var/www/html/reels"
static_base_url = ""          # e.g. "https://example.com/reels"

[schedule]
post_time = "12:30"           # local time to post every day (daemon mode)
timezone = "Asia/Jerusalem"

[telegram]
enabled = false               # send photos from your phone to a Telegram bot
bot_token = ""                # or TELEGRAM_BOT_TOKEN env
allowed_chat_ids = []         # your chat id(s); anything else is ignored
require_approval = true       # send a preview and wait for /approve before publishing
send_preview = true
